@bot.command(name="version")
async def cmd_version(ctx):
    uptime = int(time.time() - start_time)
    h, rem = divmod(uptime, 3600)
    m, s = divmod(rem, 60)
    moderation = [
        "`?addmodrole @role` - add a mod role (admin only)",
        "`?removemodrole @role` - remove mod role (admin only)",
        "`?warn @user <reason>` - warn a user",
        "`?unwarn @user [index]` - remove user's warning (index optional)",
        "`?list warnings` - list warnings in server",
        "`?list modroles` - list server mod roles",
        "`?ban @user [minutes] <reason>` - ban; minutes optional for temp ban",
        "`?kick @user <reason>` - kick user"
    ]
    fun = [
        "`?wordle` then `?guess <word>` - play wordle",
        "`?rps <rock|paper|scissors>` - play RPS",
        "`?dice <max>` - roll 1..max",
        "`?coinflip` - flip a coin",
        "`?ask <question>` - ask the AI (server only)"
    ]
    utility = [
        "`?snipe` - show last deleted message in channel",
        "`?pin <message_id>` / `?unpin <id>` / `?bulkpin <limit>`",
        "`?setslowmode <seconds>` - set channel slowmode",
        "`?remindme <10s|5m|2h> <message>` - reminder",
        "`?userinfo [@user]` - show user info",
        "`?avatar [@user]` - show avatar",
        "`?test` - run diagnostic checks"
    ]
    embed = discord.Embed(title=f"Bot v{VERSION}", color=discord.Color.blue())
    embed.add_field(name="Uptime", value=f"{h}h {m}m {s}s", inline=True)
    embed.add_field(name="Guilds", value=str(len(bot.guilds)), inline=True)
    embed.add_field(name="Python/discord.py", value=f"{platform.python_version()} / {discord.__version__}", inline=False)
    embed.add_field(name="Moderation (how to use)", value="\n".join(moderation), inline=False)
    embed.add_field(name="Fun (how to use)", value="\n".join(fun), inline=False)
    embed.add_field(name="Utility (how to use)", value="\n".join(utility), inline=False)
    await safe_send(ctx, embed=embed)

