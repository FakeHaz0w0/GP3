@bot.event
async def on_message_delete(message):
    # store last deleted per channel
    if message.guild and not message.author.bot:
        last_deleted_message[message.channel.id] = {"author": str(message.author), "content": message.content}
    await bot.process_commands(message)

@bot.event
async def on_member_join(member):
    ensure_guild(member.guild.id)
    channel = member.guild.system_channel or next((c for c in member.guild.text_channels if c.permissions_for(member.guild.me).send_messages), None)
    if channel:
        await safe_send(channel, f"( ´ ▽ ` )ﾉ Welcome {member.mention} to {member.guild.name} — running version {VERSION}!")

@bot.event
async def on_message(message):
    if message.author.bot:
        return
    if not message.guild:
        await bot.process_commands(message)
        return
    gdata = ensure_guild(message.guild.id)
    if gdata.get("auto_mod_enabled", True):
        if check_profanity(message.content):
            try:
                await message.delete()
                await safe_send(message.channel, f"(╯︵╰,) {message.author.mention}, your message was removed for profanity.")
            except Exception as e:
                print(f"[automod] delete/send failed: {e}")
            return
        if check_caps(message.content):
            try:
                await message.delete()
                await safe_send(message.channel, f"(¬_¬) {message.author.mention}, please avoid excessive caps.")
            except Exception as e:
                print(f"[automod] delete/send failed: {e}")
            return
        if check_invite(message.content):
            try:
                await message.delete()
                await safe_send(message.channel, f"(・_・;) {message.author.mention}, invite links are not allowed here.")
            except Exception as e:
                print(f"[automod] delete/send failed: {e}")
            return
    await bot.process_commands(message)

# ---------------- AI ASK (OpenAI -> DeepSeek fallback) ----------------
async def get_ai_response(prompt, model="gpt-3.5-turbo", max_tokens=800, temperature=0.7):
    """
    Async AI caller: try OpenAI (using AI_API_KEY), fallback to DeepSeek (DEEPSEEK_API_KEY).
    Returns a string answer or raises/returns error text.
    """
    if not AI_API_KEY and not DEEPSEEK_API_KEY:
        return "(⚠) No AI API key configured."

    # Try OpenAI first (async)
    if AI_API_KEY:
        try:
            url = "https://api.openai.com/v1/chat/completions"
            headers = {
                "Authorization": f"Bearer {AI_API_KEY}",
                "Content-Type": "application/json"
            }
            payload = {
                "model": model,
                "messages": [
                    {"role": "system", "content": "You are a helpful assistant."},
                    {"role": "user", "content": prompt}
                ],
                "max_tokens": max_tokens,
                "temperature": temperature
            }
            async with aiohttp.ClientSession() as session:
                async with session.post(url, headers=headers, json=payload, timeout=30) as resp:
                    if resp.status != 200:
                        text = await resp.text()
                        print(f"[get_ai_response] OpenAI error: {resp.status} {text}")
                        raise Exception(f"OpenAI error {resp.status}")
                    data = await resp.json()
                    answer = data.get("choices", [{}])[0].get("message", {}).get("content", "")
                    if not answer:
                        print(f"[get_ai_response] OpenAI returned unexpected body: {data}")
                        raise Exception("OpenAI returned unexpected body")
                    return answer.strip()
        except Exception as e:
            print(f"[get_ai_response] OpenAI failed: {e}")

    # Fallback to DeepSeek (async)
    if DEEPSEEK_API_KEY:
        try:
            url2 = "https://api.deepseek.com/v1/chat/completions"
            headers2 = {
                "Authorization": f"Bearer {DEEPSEEK_API_KEY}",
                "Content-Type": "application/json"
            }
            payload2 = {
                "model": "deepseek-chat",
                "messages": [{"role": "user", "content": prompt}],
                "max_tokens": min(800, max_tokens)
            }
            async with aiohttp.ClientSession() as session:
                async with session.post(url2, headers=headers2, json=payload2, timeout=30) as resp2:
                    if resp2.status != 200:
                        text = await resp2.text()
                        print(f"[get_ai_response] DeepSeek error: {resp2.status} {text}")
                        return f"(･_･;) DeepSeek failed: {resp2.status}"
                    data2 = await resp2.json()
                    answer2 = data2.get("choices", [{}])[0].get("message", {}).get("content", "")
                    if not answer2:
                        print(f"[get_ai_response] DeepSeek returned unexpected body: {data2}")
                        return "(･_･;) DeepSeek returned unexpected response."
                    return answer2.strip()
        except Exception as e2:
            print(f"[get_ai_response] DeepSeek failed: {e2}")
            return f"(･_･;) Both AI providers failed: {e2}"

    return "(･_･;) AI providers unavailable."

@bot.command(name="ask")
async def cmd_ask(ctx, *, question: str = None):
    if not question:
        return await safe_send(ctx, "(･_･) Please provide a question after `?ask`.")
    if ctx.guild is None:
        return await safe_send(ctx, "(･_･) The ask command only works in servers (no DMs).")
    async with ctx.typing():
        try:
            answer = await get_ai_response(question)
            # Send in chunks to avoid Discord length limits
            if not answer:
                return await safe_send(ctx, "(･_･;) AI returned no response.")
            for i in range(0, len(answer), 1900):
                await safe_send(ctx, answer[i:i+1900])
            print(f"[ask] {ctx.author} asked: {question}")
        except Exception as e:
            print(f"[ask] Exception: {e}")
            await safe_send(ctx, f"(･_･;) Error contacting AI: {e}")

